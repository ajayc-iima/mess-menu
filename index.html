<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaksha Mess Menu — Menu Card Generator</title>
<meta name="description" content="Upload the weekly mess menu spreadsheet and get a printable menu card for any date in it. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23F3EEE4'/><text x='50' y='72' font-size='62' font-family='Georgia,serif' text-anchor='middle' fill='%23161C18'>M</text></svg>">
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <p class="brand-kicker">Plaksha University</p>
      <p class="brand-name">Mess Menu <span>card generator</span></p>
    </div>

    <div class="topbar-actions" id="topbar-actions" hidden>
      <button type="button" class="toggle is-on" id="btn-calories" aria-pressed="true">Calories</button>
      <button type="button" class="btn btn-quiet" id="btn-print">Print / PDF</button>
      <button type="button" class="btn btn-gold" id="btn-png">Save as image</button>
      <button type="button" class="btn btn-quiet" id="btn-change">Change file</button>
    </div>
  </header>

  <!-- ───────────────────────────── upload ───────────────────────────── -->
  <section class="dropzone" id="dropzone" tabindex="0" role="button"
           aria-label="Upload the weekly mess menu spreadsheet">
    <p class="dz-kicker">Step 1 — the spreadsheet</p>
    <h1 class="dz-title">Drop the weekly<br>mess menu <em>.xlsx</em></h1>
    <p class="dz-help">
      The file stays on your machine — everything is parsed in the browser.
      Each date it covers becomes its own printable menu card.
    </p>
    <div class="dz-actions">
      <label class="btn btn-gold">
        Choose file
        <input id="file" type="file" accept=".xlsx,.xls,.xlsm" hidden>
      </label>
      <button type="button" class="btn btn-quiet" id="btn-sample">Try the sample menu</button>
    </div>
    <p class="dz-error" id="dz-error" hidden></p>
  </section>

  <!-- ───────────────────────────── date picker ───────────────────────────── -->
  <section class="picker" id="picker" hidden aria-label="Choose a date">
    <div class="picker-head">
      <p class="picker-kicker" id="picker-kicker">Step 2 — pick a date</p>
      <div class="picker-tools">
        <label class="picker-jump">
          <span>Jump to</span>
          <input type="date" id="date-input" aria-label="Jump to a date">
        </label>
        <span class="picker-count" id="picker-count"></span>
      </div>
    </div>
    <div class="picker-row">
      <button type="button" class="nav-arrow" id="prev-day" aria-label="Previous day">‹</button>
      <div class="chips" id="chips" role="tablist"></div>
      <button type="button" class="nav-arrow" id="next-day" aria-label="Next day">›</button>
    </div>
  </section>

  <!-- ───────────────────────────── the card ───────────────────────────── -->
  <main class="stage" id="stage" hidden>
    <article class="card" id="card"></article>
    <p class="stage-foot" id="stage-foot"></p>
  </main>

</div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
